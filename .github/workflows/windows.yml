name: Windows Jarvis
on:
  push:
    branches: [main, work, feat/jalon-2-voice-presence, feat/jalon-3a-tools]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Tests, compilation vocale et double moteur PRESENCE
        shell: powershell
        run: |
          try {
            .\scripts\build-windows.ps1 -PythonExecutable (Get-Command python).Source -WithVoice -WithGpu
          } catch {
            $Detail = $_.Exception.Message + [Environment]::NewLine + $_.InvocationInfo.PositionMessage
            $Detail = $Detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows build::$Detail"
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jarvis-Jalon2-Windows-x64-${{ github.sha }}
          path: |
            dist/jalon-2/Jarvis.exe
            dist/jalon-2/Jarvis.exe.sha256
            dist/jalon-2/diagnostics/
            docs/PRESENCE-DUAL-ENGINE.md
            requirements-gpu.txt
            docs/VOICE.md
            scripts/install_voice_models.py
            requirements-voice.txt
          if-no-files-found: error
          retention-days: 14
