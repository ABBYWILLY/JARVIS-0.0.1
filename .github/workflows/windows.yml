name: Windows Jarvis
on:
  push:
    branches: [main, work, feat/jalon-2-voice-presence]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Tests, compilation vocale et démarrage de l’EXE Jalon 2
        shell: powershell
        run: .\scripts\build-windows.ps1 -PythonExecutable (Get-Command python).Source -WithVoice
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Jalon2-Windows-x64-${{ github.sha }}
          path: |
            dist/jalon-2/Jarvis.exe
            dist/jalon-2/Jarvis.exe.sha256
            docs/VOICE.md
            scripts/install_voice_models.py
            requirements-voice.txt
          if-no-files-found: error
          retention-days: 14
